<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LearnStream — learn any subject through clear, engaging video lessons."
    />
    <title>LearnStream</title>
    <script>
      // Apply the stored theme before first paint so dark mode never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('learnstream:theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          /* storage unavailable — fall back to the default light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
